[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exactor-minesweeper"
version = "1.0.0"
description = "Neuro-Symbolic Minesweeper Benchmark: Exactor-Accelerator (Fast-Path Boolean SAT) vs Pure JEV (LLM/RLCD)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "EXACTOR AI Research Team" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]

[project.scripts]
exactor-minesweeper = "exactor_minesweeper.cli:main"
